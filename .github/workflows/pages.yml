# Build the Axis & Allies game as a static, in-browser ("play on this device")
# site and publish it to GitHub Pages — so it's playable from any phone or
# laptop web browser with no server and no local setup.
#
# ENABLE ONCE (from your phone, in the browser):
#   Repo -> Settings -> Pages -> Build and deployment ->
#   Source: "Deploy from a branch" -> Branch: gh-pages / (root) -> Save.
# Then open:  https://<your-username>.github.io/tabletop/
#
# Re-runs automatically whenever the game changes on main.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build the in-browser game
        env:
          VITE_AA_LOCAL: "1" # run the engine in the browser (no server)
          VITE_BASE: "/tabletop/" # served under https://user.github.io/tabletop/
        run: |
          npm ci
          npm run build
          touch dist/client/.nojekyll

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/client
          publish_branch: gh-pages
